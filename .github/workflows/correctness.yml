name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: luced-browser
      - name: Read the compiler pins
        id: pins
        shell: bash
        run: |
          echo "base=$(tr -d '\n' < luced-browser/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(tr -d '\n' < luced-browser/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - name: Check out the pinned packages (luce-ui, the engine and what they use)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            revision=${revision%$'\r'}
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luced-browser/bootstrap/PACKAGES
      - name: Linux libraries the window and font backends link
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core mesa-vulkan-drivers xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build the compilers from the pinned sources
        working-directory: luced-browser
        run: python3 tools/bootstrap.py
      - name: Formatting and the headless tests
        working-directory: luced-browser
        env:
          LUCE_STD: ${{ github.workspace }}/luce-base/src/std
        run: |
          export PATH="$PWD/build/toolchain:$PATH"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ./test.sh; else ./test.sh; fi
