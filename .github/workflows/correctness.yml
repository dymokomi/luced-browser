name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: luced-browser
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luced-browser luce
      - name: Linux libraries the window and font backends link
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core mesa-vulkan-drivers xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build the compilers from main
        working-directory: luced-browser
        run: python3 tools/bootstrap.py
      - name: Formatting and the headless tests
        working-directory: luced-browser
        env:
          LUCE_STD: ${{ github.workspace }}/luce-base/src/std
        run: |
          export PATH="$PWD/build/toolchain:$PATH"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ./test.sh; else ./test.sh; fi
